name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack the project
        run: unzip -q sproutly.zip

      - name: Build the APK
        run: bash sproutly/ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Sproutly-APK
          path: out/Sproutly.apk
          if-no-files-found: error
